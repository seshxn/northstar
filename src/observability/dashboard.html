<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Northstar dashboard</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f7f4;
        --panel: #ffffff;
        --text: #191919;
        --muted: #64645f;
        --line: #d9d9d2;
        --accent: #176f6b;
        --warn: #9b4d00;
        --bad: #9f1d35;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header {
        align-items: center;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 16px;
        justify-content: space-between;
        padding: 18px 24px;
      }
      h1 { font-size: 20px; margin: 0; }
      button {
        background: var(--accent);
        border: 0;
        color: white;
        cursor: pointer;
        font: inherit;
        padding: 8px 12px;
      }
      button.secondary {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--text);
      }
      main {
        display: grid;
        gap: 18px;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        padding: 20px 24px;
      }
      section {
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 16px;
      }
      section.wide { grid-column: span 4; }
      h2 { font-size: 14px; margin: 0 0 12px; text-transform: uppercase; }
      .metric { font-size: 30px; font-weight: 700; }
      .muted { color: var(--muted); }
      table { border-collapse: collapse; width: 100%; }
      th, td { border-top: 1px solid var(--line); padding: 10px 8px; text-align: left; vertical-align: top; }
      th { color: var(--muted); font-size: 12px; text-transform: uppercase; }
      .status-completed { color: var(--accent); font-weight: 700; }
      .status-failed, .status-timeout { color: var(--bad); font-weight: 700; }
      .status-cancelled { color: var(--warn); font-weight: 700; }
      @media (max-width: 800px) {
        header { align-items: flex-start; flex-direction: column; }
        main { grid-template-columns: 1fr; padding: 14px; }
        section.wide { grid-column: span 1; }
        table { display: block; overflow-x: auto; }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Northstar dashboard</h1>
        <div class="muted" id="updated">Loading state...</div>
      </div>
      <button id="refresh">Refresh</button>
    </header>
    <main id="app"></main>
    <script>
      const app = document.querySelector("#app");
      const updated = document.querySelector("#updated");
      document.querySelector("#refresh").addEventListener("click", () => refresh(true));

      async function refresh(manual = false) {
        if (manual) await fetch("/api/v1/refresh", { method: "POST" });
        const response = await fetch("/api/v1/state");
        const state = await response.json();
        updated.textContent = `Last refreshed ${new Date().toLocaleTimeString()}`;
        render(state);
      }

      function render(state) {
        app.innerHTML = `
          ${metric("Running", state.running.length)}
          ${metric("Completed", state.completed.length)}
          ${metric("Retrying", state.retryAttempts.length)}
          ${metric("Awaiting", (state.awaitingReview || []).length)}
          ${table("Running issues", state.running, ["issue", "threadId", "workspacePath", "eventCount"], true)}
          ${table("Awaiting review", state.awaitingReview || [], ["issue", "title", "updatedAt", "planOutput"], false, reviewActions)}
          ${table("Recent results", state.results || [], ["issue", "status", "attempt", "eventCount", "output"], false)}
          ${table("Retry queue", state.retryAttempts, ["issueId", "attempt", "dueAt"], false)}
        `;
      }

      function metric(label, value) {
        return `<section><h2>${escapeHtml(label)}</h2><div class="metric">${escapeHtml(String(value))}</div></section>`;
      }

      function table(title, rows, keys, controls, actionRenderer = actions) {
        const hasActions = controls || actionRenderer !== actions;
        const body = rows.length === 0
          ? `<tr><td colspan="${keys.length + (hasActions ? 1 : 0)}" class="muted">None</td></tr>`
          : rows.map((row) => `<tr>${keys.map((key) => cell(key, row[key])).join("")}${hasActions ? actionRenderer(row) : ""}</tr>`).join("");
        return `<section class="wide"><h2>${escapeHtml(title)}</h2><table><thead><tr>${keys.map((key) => `<th>${escapeHtml(key)}</th>`).join("")}${hasActions ? "<th>Actions</th>" : ""}</tr></thead><tbody>${body}</tbody></table></section>`;
      }

      function cell(key, value) {
        const className = key === "status" ? ` class="status-${escapeHtml(String(value))}"` : "";
        return `<td${className}>${escapeHtml(String(value ?? ""))}</td>`;
      }

      function actions(row) {
        const id = encodeURIComponent(row.issueId || row.issue);
        return `<td><button class="secondary" onclick="fetch('/api/v1/${id}/stop',{method:'POST'}).then(()=>refresh())">Stop</button></td>`;
      }

      function reviewActions(row) {
        const id = encodeURIComponent(row.issueId || row.issue);
        return `<td><button class="secondary" onclick="fetch('/api/v1/${id}/approve',{method:'POST'}).then(()=>refresh())">Approve</button></td>`;
      }

      function escapeHtml(value) {
        return value.replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
      }

      refresh();
      setInterval(() => refresh(), 3000);
    </script>
  </body>
</html>
