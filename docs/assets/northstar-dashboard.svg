<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Northstar operator dashboard</title>
  <desc id="desc">A dark operator dashboard showing issue queues, agent runtime status, telemetry, and the tracker to workspace to pull request workflow.</desc>
